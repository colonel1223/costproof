[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "costproof"
version = "0.1.0"
description = "The counterfactual layer for cloud and AI spend: prove what an optimisation actually saved."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Spencer Cottrell" }]
keywords = ["finops", "causal-inference", "econometrics", "cloud-cost", "focus"]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.23", "ruff>=0.6"]
agent = ["mcp>=2.0", "ibm-watsonx-ai>=1.1"]
report = ["openpyxl>=3.1", "XlsxWriter>=3.2"]

[project.scripts]
costproof = "costproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
